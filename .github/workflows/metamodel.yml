name: metamodel

on:
  push:
    paths: ["reference-implementation/**", ".github/workflows/metamodel.yml"]
  pull_request:
    paths: ["reference-implementation/**", ".github/workflows/metamodel.yml"]
  workflow_dispatch:
    inputs:
      script:
        description: Script to run
        type: choice
        options: [metamodel.py, pytest]
        default: metamodel.py
      args:
        description: "Arguments, paths relative to reference-implementation/ (e.g. 'example.yaml --json', '--impact order', '--schema')"
        default: example.yaml

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t metamodel reference-implementation
      - name: Run
        env:
          SCRIPT: ${{ github.event_name == 'workflow_dispatch' && inputs.script || '' }}
          ARGS: ${{ github.event_name == 'workflow_dispatch' && inputs.args || '' }}
        run: |
          run() { docker run --rm -v "$PWD:/repo" -w /repo/reference-implementation metamodel "$@" 2>&1 | tee -a out.txt; return "${PIPESTATUS[0]}"; }
          if [ -n "$SCRIPT" ]; then
            read -ra A <<< "$ARGS"
            [ "$SCRIPT" = pytest ] && cmd=(pytest) || cmd=(python metamodel.py)
            status=0; run "${cmd[@]}" "${A[@]}" || status=$?
          else
            status=0; run pytest -q -p no:cacheprovider || status=$?
            run python metamodel.py example.yaml || status=$?
          fi
          { echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
