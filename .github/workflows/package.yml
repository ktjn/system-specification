name: package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Behaviour changes need a CHANGELOG entry
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$changed" | grep -Eq '^reference-implementation/(metamodel\.py|schema\.json|fragment\.schema\.json)$' && ! echo "$changed" | grep -qx CHANGELOG.md; then
            echo "::error::metamodel.py or a schema changed without a CHANGELOG.md entry under Unreleased"; exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
      - run: uv build
      - run: uv run pytest -q
      - name: Installed-wheel smoke test
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          uv venv smoke
          uv pip install --python smoke "$GITHUB_WORKSPACE"/dist/*.whl
          S=smoke/bin/system-spec
          "$S" --version
          "$S"
          "$S" export out
          "$S" out/examples/greenfield/spec.yaml --stage release
          "$S" out/examples/brownfield/spec.yaml --stage release --compat out/examples/brownfield/old.yaml
