name: package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
      - run: uv build
      - run: uv run pytest -q
      - name: Installed-wheel smoke test
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          uv venv smoke
          uv pip install --python smoke "$GITHUB_WORKSPACE"/dist/*.whl
          S=smoke/bin/system-spec
          "$S" --version
          "$S"
          "$S" export out
          "$S" out/examples/greenfield/spec.yaml --stage release
          "$S" out/examples/brownfield/spec.yaml --stage release --compat out/examples/brownfield/old.yaml
