system:
  id: commerce-system
  version: '1.0'
  layers:
  - experience
  - application
  - domain
  - infrastructure
  external_sources:
  - erp-product-feed
  quality_attributes:
    latency_p95: <100ms
    throughput: 1000 req/s
  status: draft
capabilities:
- id: place-order
  version: '1.0'
  preconditions:
  - cart_not_empty
  - customer_active
  postconditions:
  - order_created
  - inventory_reserved
  invariants:
  - order_paid_at_most_once
  failure_modes:
  - insufficient_inventory
  - customer_blocked
  status: specified
  interface:
    endpoint: POST /v1/orders
    mode: sync
    request: order
    response: order
    idempotency: true
    security: authenticated commerce service
    failure_statuses:
      insufficient_inventory: '409'
      customer_blocked: '409'
- id: reserve-inventory
  version: '1.0'
  preconditions:
  - product_exists
  - quantity_positive
  postconditions:
  - reservation_created
  - stock_decremented
  invariants:
  - stock_never_negative
  failure_modes:
  - insufficient_inventory
  - product_not_found
  status: specified
  interface:
    endpoint: POST /v1/reservations
    mode: sync
    request: stock-item
    response: stock-item
    idempotency: true
    security: authenticated commerce service
    failure_statuses:
      insufficient_inventory: '409'
      product_not_found: '409'
components:
- id: checkout
  version: '1.0'
  layer: application
  provides:
  - place-order
  requires:
  - reserve-inventory@^1.0
  owns_data:
  - order
  status: specified
- id: inventory
  version: '1.0'
  layer: domain
  provides:
  - reserve-inventory
  owns_data:
  - stock-item
  - order-stock-projection
  status: specified
data_models:
- id: stock-item
  version: '1.0'
  owner: inventory
  classification: internal
  external_source: erp-product-feed
  fields:
    product_id: uuid
    available_qty: int
- id: order
  version: '1.0'
  owner: checkout
  classification: confidential
  fields:
    order_id: uuid
    customer_email: string
    status: string
- id: order-stock-projection
  version: '1.0'
  owner: inventory
  classification: confidential
  derived_from:
  - order
  - stock-item
  fields:
    order_id: uuid
    product_id: uuid
