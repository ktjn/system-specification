system:
  id: commerce-system
  version: '1.0'
  layers:
  - experience
  - application
  - domain
  - infrastructure
  external_sources:
  - erp-product-feed
  quality_attributes:
    latency_p95: <100ms
    throughput: 1000 req/s
  status: draft
capabilities:
- id: place-order
  version: '1.0'
  preconditions:
  - cart_not_empty
  - customer_active
  postconditions:
  - order_created
  - inventory_reserved
  invariants:
  - order_paid_at_most_once
  failure_modes:
  - insufficient_inventory
  - customer_blocked
  status: specified
  interface:
    endpoint: POST /v1/orders
    mode: sync
    request: order
    response: order
    idempotency: true
    security: authenticated commerce service
    failure_statuses:
      insufficient_inventory: '409'
      customer_blocked: '409'
- id: reserve-inventory
  version: '1.0'
  preconditions:
  - product_exists
  - quantity_positive
  postconditions:
  - reservation_created
  - stock_decremented
  invariants:
  - stock_never_negative
  failure_modes:
  - insufficient_inventory
  - product_not_found
  status: specified
  interface:
    endpoint: POST /v1/reservations
    mode: sync
    request: stock-item
    response: stock-item
    idempotency: true
    security: authenticated commerce service
    failure_statuses:
      insufficient_inventory: '409'
      product_not_found: '409'
components:
- id: checkout
  version: '1.0'
  layer: application
  provides:
  - place-order
  requires:
  - reserve-inventory@^1.0
  owns_data:
  - order
  status: specified
- id: inventory
  version: '1.0'
  layer: domain
  provides:
  - reserve-inventory
  owns_data:
  - stock-item
  - order-stock-projection
  status: specified
data_models:
- id: stock-item
  version: '1.0'
  owner: inventory
  classification: internal
  external_source: erp-product-feed
  fields:
    product_id: uuid
    available_qty: int
- id: order
  version: '1.0'
  owner: checkout
  classification: confidential
  fields:
    order_id: uuid
    customer_email: string
    status: string
- id: order-stock-projection
  version: '1.0'
  owner: inventory
  classification: confidential
  derived_from:
  - order
  - stock-item
  fields:
    order_id: uuid
    product_id: uuid
requirements:
- id: req-order-func
  version: '1.0'
  target: place-order
  criteria:
  - order created when stock available
  status: specified
  category: functional
- id: req-order-sem
  version: '1.0'
  target: place-order
  criteria:
  - blocked customer cannot place order
  status: specified
  category: semantic
- id: req-order-contract
  version: '1.0'
  target: place-order
  criteria:
  - returns 201 on creation and 409 on insufficient_inventory
  status: specified
  category: contract
- id: req-order-serial
  version: '1.0'
  target: order
  criteria:
  - order JSON payload validates against schema
  status: specified
  category: serialization
- id: req-reserve-conc
  version: '1.0'
  target: reserve-inventory
  criteria:
  - stock never negative under concurrent reservations
  status: specified
  category: concurrency
- id: req-projection
  version: '1.0'
  target: order-stock-projection
  criteria:
  - every projection references an existing order and stock-item
  status: specified
  category: semantic
- id: req-latency
  version: '1.0'
  target: commerce-system
  kind: non-functional
  criteria:
  - p95 < 100ms
  status: specified
  category: performance
- id: req-scale
  version: '1.0'
  target: commerce-system
  kind: non-functional
  criteria:
  - sustains 1000 req/s
  status: specified
  category: scalability
- id: req-resilience
  version: '1.0'
  target: checkout
  kind: non-functional
  criteria:
  - retries transient inventory timeouts with idempotency key
  status: specified
  category: resilience
- id: req-security
  version: '1.0'
  target: checkout
  kind: non-functional
  criteria:
  - requires authenticated customer token
  status: specified
  category: security
- id: req-observability
  version: '1.0'
  target: commerce-system
  kind: non-functional
  criteria:
  - emits correlation_id and reservation latency metrics
  status: specified
  category: observability
- id: req-reserve-func
  version: '1.0'
  status: specified
  target: reserve-inventory
  category: functional
  kind: functional
  criteria:
  - A successful reservation decreases available_qty by the requested positive quantity
- id: req-reserve-sem
  version: '1.0'
  status: specified
  target: reserve-inventory
  category: semantic
  kind: functional
  criteria:
  - Unknown products produce product_not_found without modifying stock
- id: req-reserve-contract
  version: '1.0'
  status: specified
  target: reserve-inventory
  category: contract
  kind: functional
  criteria:
  - Insufficient inventory returns the declared failure status without decrementing
    stock
- id: req-stock-serial
  version: '1.0'
  status: specified
  target: stock-item
  category: serialization
  kind: functional
  criteria:
  - Stock payloads contain a UUID product_id and integer available_qty
- id: req-order-conc
  version: '1.0'
  status: specified
  target: place-order
  category: concurrency
  kind: functional
  criteria:
  - Concurrent retries with the same idempotency key create one order and charge it
    at most once
- id: req-reserve-resilience
  version: '1.0'
  status: specified
  target: inventory
  category: resilience
  kind: non-functional
  criteria:
  - Retrying a reservation after a timeout does not reserve inventory twice
- id: req-reserve-security
  version: '1.0'
  status: specified
  target: inventory
  category: security
  kind: non-functional
  criteria:
  - Reject calls without an authenticated commerce service identity before changing
    stock
risks:
- id: risk-oversell
  target: inventory
  treatment: mitigation
  mitigated_by:
  - req-reserve-conc
- id: risk-erp-delay
  target: commerce-system
  treatment: acceptance
  residual_accepted: true
- id: risk-payment-fraud
  target: commerce-system
  treatment: transfer
  transferred_to: payment-provider
  residual_accepted: true
