[project]
name = "system-spec-ref"
version = "0.4.0"
description = "System specification toolkit: metamodel validator, examples and formal-model skills."
readme = "PYPI.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tommy Alander" }]
keywords = ["specification", "metamodel", "architecture", "validator", "brownfield", "greenfield"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/ktjn/system-specification"
Source = "https://github.com/ktjn/system-specification"
Issues = "https://github.com/ktjn/system-specification/issues"

[project.scripts]
system-spec = "system_spec_ref.cli:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build]
artifacts = [
    "/system_spec_ref/metamodel.py",
    "/system_spec_ref/toolkit/**",
]

[tool.hatch.build.targets.wheel]
packages = ["system_spec_ref"]

[tool.hatch.build.targets.sdist]
include = [
    "/system_spec_ref",
    "/reference-implementation",
    "/examples",
    "/archive",
    "/.github/skills",
    "/.github/workflows/metamodel.yml",
    "/toolkit_manifest.txt",
    "/build_support.py",
    "/hatch_build.py",
    "/BROWNFIELD.md",
    "/CHANGELOG.md",
    "/FEATURE.md",
    "/EXPERIENCE.md",
    "/MODEL-SCOPE.md",
    "/CONSTITUTION.md",
    "/GREENFIELD.md",
    "/PACKAGING.md",
    "/PLAN.md",
    "/README.md",
    "/PYPI.md",
    "/LICENSE",
    "/WIRING.md",
    "/packaging.yaml",
    "/spec.md",
    "/templates",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
