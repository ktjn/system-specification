system:
  id: commerce-system
  version: "1.0"
  layers: [experience, application, domain, infrastructure]
  external_sources: [erp-product-feed]
  quality_attributes: { latency_p95: "<100ms", throughput: "1000 req/s" }

capabilities:
  - id: place-order
    version: "1.0"
    preconditions: [cart_not_empty, customer_active]
    postconditions: [order_created, inventory_reserved]
    invariants: [order_paid_at_most_once]
    failure_modes: [insufficient_inventory, customer_blocked]
  - id: reserve-inventory
    version: "1.0"
    preconditions: [product_exists, quantity_positive]
    postconditions: [reservation_created, stock_decremented]
    invariants: [stock_never_negative]
    failure_modes: [insufficient_inventory, product_not_found]

components:
  - id: checkout
    version: "1.0"
    layer: application
    provides: [place-order]
    requires: [reserve-inventory@^1.0]
    owns_data: [order]
  - id: inventory
    version: "1.0"
    layer: domain
    provides: [reserve-inventory]
    owns_data: [stock-item, order-stock-projection]

data_models:
  - id: stock-item
    version: "1.0"
    owner: inventory
    classification: internal
    external_source: erp-product-feed
    fields: { product_id: uuid, available_qty: int }
  - id: order
    version: "1.0"
    owner: checkout
    classification: confidential
    fields: { order_id: uuid, customer_email: string, status: string }
  - id: order-stock-projection
    version: "1.0"
    owner: inventory
    classification: confidential
    derived_from: [order, stock-item]
    fields: { order_id: uuid, product_id: uuid }

requirements:
  - { id: req-order, version: "1.0", target: place-order, criteria: [order created when stock available] }
  - { id: req-reserve, version: "1.0", target: reserve-inventory, criteria: [stock never negative] }
  - { id: req-projection, version: "1.0", target: order-stock-projection, criteria: [every projection references an existing order and stock-item] }
  - { id: req-latency, version: "1.0", target: commerce-system, kind: non-functional, criteria: [p95 < 100ms] }

risks:
  - { id: risk-oversell, target: inventory, treatment: mitigation, mitigated_by: [req-reserve] }
  - { id: risk-erp-delay, target: commerce-system, treatment: acceptance, residual_accepted: true }

evidence:
  - { id: ev-order-test, requirement_id: req-order, requirement_version: "1.0", method: test, passed: true, provenance: pytest::test_checkout }
  - { id: ev-reserve-test, requirement_id: req-reserve, requirement_version: "1.0", method: proof, passed: true, provenance: tla+::Inventory.tla }
  - { id: ev-projection-alloy, requirement_id: req-projection, requirement_version: "1.0", method: proof, passed: true, provenance: alloy::Inventory.als }
  - { id: ev-latency-bench, requirement_id: req-latency, requirement_version: "1.0", method: analysis, passed: true, provenance: k6::load_report }
